<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 가계부</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><small>OUR ACCOUNT BOOK</small><h1>우리 가계부</h1></div><button id="logout" class="quiet" hidden>로그아웃</button></header>
<main><section id="login" class="card"><h2>함께 쓰는 가계부</h2><p>공용 비밀번호로 접속해 주세요.</p><form id="login-form"><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button>접속하기</button></form></section>
<div id="app" hidden><section class="card"><div class="month"><button id="prev" class="quiet" aria-label="이전 달">←</button><h2 id="month-label"></h2><button id="next" class="quiet" aria-label="다음 달">→</button></div><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendar" class="calendar"></div></section>
<section class="card"><div class="section-title"><div><small>DAILY RECORD</small><h2 id="date-label"></h2></div><button id="new">+ 거래 추가</button></div><div id="list"></div></section>
<section class="card" id="category-panel"><div class="section-title"><div><small>CATEGORIES</small><h2>카테고리 관리</h2></div><button id="category-toggle" class="quiet" type="button" aria-expanded="false">열기</button></div><div id="category-content" hidden><form id="category-form"><div class="fields"><label>구분<select name="type"><option value="expense">지출</option><option value="income">수입</option></select></label><label>이름<input name="name" maxlength="50" required></label></div><button>카테고리 추가</button></form><div id="category-list"></div></div></section><section class="card"><div class="section-title"><div><small>SETTINGS</small><h2>설정과 백업</h2></div><button id="settings-toggle" class="quiet" type="button" aria-expanded="false">열기</button></div><div id="settings-content" hidden><form id="password-form"><label>현재 비밀번호<input name="current_password" type="password" autocomplete="current-password" maxlength="256" required></label><label>새 비밀번호 (12자 이상)<input name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><label>새 비밀번호 확인<input name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><button>비밀번호 변경</button></form><hr><p>거래와 카테고리를 JSON 파일로 저장합니다.</p><button id="backup" class="quiet" type="button">백업 파일 내려받기</button><hr><p>복원은 카테고리와 거래가 모두 없는 가계부에서만 가능합니다.</p><form id="restore-form"><label>백업 파일<input name="file" type="file" accept="application/json,.json" required></label><button>빈 가계부에 복원</button></form></div></section><section class="card" id="editor" hidden><div class="section-title"><h2 id="editor-title">거래 추가</h2><button id="cancel" class="quiet">닫기</button></div><form id="transaction-form"><div class="fields"><label>구분<select name="type"><option value="expense">지출</option><option value="income">수입</option></select></label><label>날짜<input name="transaction_date" type="date" required></label><label>금액<input name="amount" type="number" min="1" max="9007199254740991" step="1" required></label><label>카테고리<select name="category_id" required></select></label><label>주체<input name="subject" maxlength="100" placeholder="예: 우리, 남편, 아내"></label><label>지불 방식<input name="payment_method" maxlength="100"></label></div><label>메모<input name="memo" maxlength="1000"></label><button>저장하기</button></form></section></div><p id="message" role="status" aria-live="polite"></p></main><script type="module" src="/app.js"></script></body></html>
