<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 가계부</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand"><span class="brand-icon" aria-hidden="true">♥</span><div><small>우리의 매일을 모아</small><h1>우리 가계부</h1></div></div><div id="header-actions" class="header-actions" hidden><button id="category-shortcut" class="icon-button" type="button" aria-label="카테고리 관리" aria-controls="category-panel" aria-expanded="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></button><button id="settings-shortcut" class="icon-button" type="button" aria-label="설정과 백업" aria-controls="settings-panel" aria-expanded="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.2 13.8a7.4 7.4 0 0 0 0-3.6l1.5-1.1-1.5-2.6-1.8.7a7.8 7.8 0 0 0-3.1-1.8L14 3h-4l-.3 2.4a7.8 7.8 0 0 0-3.1 1.8l-1.8-.7-1.5 2.6 1.5 1.1a7.4 7.4 0 0 0 0 3.6l-1.5 1.1 1.5 2.6 1.8-.7a7.8 7.8 0 0 0 3.1 1.8L10 21h4l.3-2.4a7.8 7.8 0 0 0 3.1-1.8l1.8.7 1.5-2.6z"/></svg></button><button id="logout" class="quiet">로그아웃</button></div></header>
<main><section id="login" class="card"><div class="login-art" aria-hidden="true"><span class="art-spark spark-one">✦</span><span class="art-spark spark-two">✦</span><span class="art-coin coin-one">₩</span><span class="art-coin coin-two">♥</span><span class="art-wallet"><span class="wallet-slot"></span><span class="wallet-clasp"></span></span></div><span class="eyebrow">둘이 함께, 차곡차곡</span><h2>우리의 돈 이야기를<br>가볍게 시작해요</h2><p>함께 정한 공용 비밀번호로 들어가요.</p><form id="login-form"><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button>가계부 시작하기</button></form></section>
<div id="app" hidden><section class="card"><div class="month"><button id="prev" class="quiet" aria-label="이전 달">←</button><h2 id="month-label"></h2><button id="next" class="quiet" aria-label="다음 달">→</button></div><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendar" class="calendar"></div></section>
<section class="card"><div class="section-title"><div><small>함께 쌓아가는 기록</small><h2 id="date-label"></h2></div><button id="new">+ 거래 추가</button></div><div id="list"></div></section>
<section class="card" id="category-panel" hidden><div class="section-title"><div><small>우리만의 분류</small><h2>카테고리 관리</h2></div><button id="category-toggle" class="quiet" type="button" aria-expanded="false">열기</button></div><div id="category-content" hidden><form id="category-form"><div class="fields"><label>구분<select name="type"><option value="expense">지출</option><option value="income">수입</option></select></label><label>이름<input name="name" maxlength="50" required></label></div><button>카테고리 추가</button></form><div id="category-list"></div></div></section><section class="card" id="settings-panel" hidden><div class="section-title"><div><small>안전하게 관리하기</small><h2>설정과 백업</h2></div><button id="settings-toggle" class="quiet" type="button" aria-expanded="false">열기</button></div><div id="settings-content" hidden><form id="password-form"><label>현재 비밀번호<input name="current_password" type="password" autocomplete="current-password" maxlength="256" required></label><label>새 비밀번호 (8자 이상)<input name="new_password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></label><label>새 비밀번호 확인<input name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></label><button>비밀번호 변경</button></form><hr><p>거래와 카테고리를 JSON 파일로 저장합니다.</p><button id="backup" class="quiet" type="button">백업 파일 내려받기</button><hr><p>복원은 카테고리와 거래가 모두 없는 가계부에서만 가능합니다.</p><form id="restore-form"><label>백업 파일<input name="file" type="file" accept="application/json,.json" required></label><button>빈 가계부에 복원</button></form></div></section><section class="card" id="editor" hidden><div class="section-title"><h2 id="editor-title">거래 추가</h2><button id="cancel" class="quiet">닫기</button></div><form id="transaction-form"><div class="fields"><label>구분<select name="type"><option value="expense">지출</option><option value="income">수입</option></select></label><label>날짜<input name="transaction_date" type="date" required></label><label>금액<input name="amount" type="number" min="1" max="9007199254740991" step="1" required></label><label>카테고리<select name="category_id" required></select></label><label>주체<select name="subject"><option value="">선택 안 함</option><option>기타</option><option>남편</option><option>시댁</option><option>아내</option><option>아들</option><option>우리</option><option>졸리</option><option>처가댁</option></select></label><label>지불 방식<input name="payment_method" maxlength="100"></label></div><label>메모<input name="memo" maxlength="1000"></label><button>저장하기</button></form></section></div><p id="message" role="status" aria-live="polite"></p></main><script type="module" src="/app.js"></script></body></html>
